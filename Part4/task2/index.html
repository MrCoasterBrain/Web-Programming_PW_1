<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="./css/styles.css">
  <title>Наши эксперты</title>
</head>

<body>
  <!-- Раздел оборачивает заголовок и блок с экспертами -->
  <section class="section">
    <h2 class="section-title">Наши эксперты</h2>
    
    <!-- Блок с карточками экспертов -->
    <div class="experts">
      
      <!-- Карточка 1 -->
      <div class="expert">
        <img src="img/001.webp" class="expert-photo" alt="Чебурашка">
        <span class="expert-name">Чебурашка</span>
      </div>

      <!-- Карточка 2 -->
      <div class="expert">
        <img src="img/002.jpg" class="expert-photo" alt="Винни-Пух">
        <span class="expert-name">Винни-Пух</span>
      </div>

      <!-- Карточка 3 -->
      <div class="expert">
        <img src="img/003.jpg" class="expert-photo" alt="Крокодил Гена">
        <span class="expert-name">Крокодил Гена</span>
      </div>

      <!-- Карточка 4 -->
      <div class="expert">
        <img src="img/004.jpg" class="expert-photo" alt="Кот Леопольд">
        <span class="expert-name">Кот Леопольд</span>
      </div>

      <!-- Карточка 5 -->
      <div class="expert">
        <img src="img/005.jpg" class="expert-photo" alt="Мамонтенок">
        <span class="expert-name">Мамонтенок</span>
      </div>

      <!-- Карточка 6 -->
      <div class="expert">
        <img src="img/006.jpg" class="expert-photo" alt="Паровозик из Ромашково">
        <span class="expert-name">Паровозик из Ромашково</span>
      </div>
      
    </div>
  </section>
</body>
</html>
